<svg viewBox="0 0 1180 682" width='1180' height='682' xmlns='http://www.w3.org/2000/svg' font-family='Georgia, serif' >
  <rect width='1180' height='682' fill='#fafafa'/>
<defs><marker id='arrd' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#2c3e50'/></marker><marker id='arrb' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#2980b9'/></marker><marker id='arrg' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#27ae60'/></marker><marker id='arro' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#ca6f1e'/></marker><marker id='arrp' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#8e44ad'/></marker><marker id='arrr' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#c0392b'/></marker><marker id='arrt' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#16a085'/></marker></defs>
<rect x='0' y='0' width='1180' height='44' fill='#2c3e50' fill-opacity='1.0' rx='0'/>
<text x='590' y='29' text-anchor='middle' font-size='18' fill='white' font-weight='bold'>The sentence loop of one path</text>
<text x='590' y='66' text-anchor='middle' font-size='13' fill='#626567' font-style='italic'>Grammar reading with supervised output · attention, composition, thought and the per-stream choice</text>
<rect x='28' y='144' width='224' height='94' fill='#d6eaf8' fill-opacity='1.0' rx='10' stroke='#2980b9' stroke-width='1.8'/>
<text x='42' y='168' text-anchor='start' font-size='15' fill='#2980b9' font-weight='bold'>Open attention · look zero</text>
<text x='42' y='192' text-anchor='start' font-size='12.5' fill='#2c3e50'>Locate percepts across the input.</text>
<text x='42' y='211' text-anchor='start' font-size='12.5' fill='#2c3e50'>Read the opening conceptual field.</text>
<rect x='323' y='144' width='206' height='94' fill='#d6eaf8' fill-opacity='1.0' rx='10' stroke='#2980b9' stroke-width='1.8'/>
<text x='337' y='168' text-anchor='start' font-size='15' fill='#2980b9' font-weight='bold'>Request the next look</text>
<text x='337' y='192' text-anchor='start' font-size='12.5' fill='#2c3e50'>Read the opening, kept trace,</text>
<text x='337' y='211' text-anchor='start' font-size='12.5' fill='#2c3e50'>place and whole STM stack.</text>
<rect x='601' y='144' width='256' height='94' fill='#d1f2eb' fill-opacity='1.0' rx='10' stroke='#16a085' stroke-width='1.8'/>
<text x='615' y='168' text-anchor='start' font-size='15' fill='#16a085' font-weight='bold'>Update the field at the fixation</text>
<text x='615' y='192' text-anchor='start' font-size='12.5' fill='#2c3e50'>Decay the trace. Apply expectation</text>
<text x='615' y='211' text-anchor='start' font-size='12.5' fill='#2c3e50'>on ascent and attention on descent.</text>
<rect x='927' y='144' width='224' height='94' fill='#e8daef' fill-opacity='1.0' rx='10' stroke='#8e44ad' stroke-width='1.8'/>
<text x='941' y='168' text-anchor='start' font-size='15' fill='#8e44ad' font-weight='bold'>Compose in STM</text>
<text x='941' y='192' text-anchor='start' font-size='12.5' fill='#2c3e50'>Shift the word that arrived.</text>
<text x='941' y='211' text-anchor='start' font-size='12.5' fill='#2c3e50'>Reduce the stack.</text>
<path d='M 252 188 L 323 188' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<path d='M 529 188 L 601 188' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<path d='M 857 188 L 927 188' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<path d='M 1040 144 L 1040 112 L 426 112 L 426 144' fill='none' stroke='#8e44ad' stroke-width='1.8' marker-end='url(#arrp)'/>
<text x='730' y='103' text-anchor='middle' font-size='13' fill='#8e44ad'>Next look reads the kept trace and the updated stack</text>
<rect x='28' y='321' width='224' height='94' fill='#d1f2eb' fill-opacity='1.0' rx='10' stroke='#16a085' stroke-width='1.8'/>
<text x='42' y='345' text-anchor='start' font-size='15' fill='#16a085' font-weight='bold'>Reverse the opening field</text>
<text x='42' y='369' text-anchor='start' font-size='12.5' fill='#2c3e50'>Decode once at observed places</text>
<text x='42' y='388' text-anchor='start' font-size='12.5' fill='#2c3e50'>and reuse across candidate paths.</text>
<path d='M 140 238 L 140 321' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<text x='150' y='280' text-anchor='start' font-size='12' fill='#626567'>shared opening</text>
<rect x='323' y='321' width='206' height='94' fill='#e8daef' fill-opacity='1.0' rx='10' stroke='#8e44ad' stroke-width='1.8'/>
<text x='337' y='345' text-anchor='start' font-size='15' fill='#8e44ad' font-weight='bold'>Publish understanding</text>
<text x='337' y='369' text-anchor='start' font-size='12.5' fill='#2c3e50'>Read the composed meaning</text>
<text x='337' y='388' text-anchor='start' font-size='12.5' fill='#2c3e50'>and its conceptual field.</text>
<path d='M 426 238 L 426 321' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<text x='436' y='280' text-anchor='start' font-size='12' fill='#626567'>reading ends</text>
<rect x='601' y='321' width='256' height='94' fill='#e8daef' fill-opacity='1.0' rx='10' stroke='#8e44ad' stroke-width='1.8'/>
<text x='615' y='345' text-anchor='start' font-size='15' fill='#8e44ad' font-weight='bold'>Closing thought</text>
<text x='615' y='369' text-anchor='start' font-size='12.5' fill='#2c3e50'>Read this path’s understanding</text>
<text x='615' y='388' text-anchor='start' font-size='12.5' fill='#2c3e50'>and resolve its answer.</text>
<path d='M 529 367 L 601 367' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<rect x='927' y='321' width='224' height='94' fill='#fdebd0' fill-opacity='1.0' rx='10' stroke='#ca6f1e' stroke-width='1.8'/>
<text x='941' y='345' text-anchor='start' font-size='15' fill='#ca6f1e' font-weight='bold'>Generate the text answer</text>
<text x='941' y='369' text-anchor='start' font-size='12.5' fill='#2c3e50'>Write terminal occurrences and</text>
<text x='941' y='388' text-anchor='start' font-size='12.5' fill='#2c3e50'>realize them through reverse.</text>
<path d='M 857 367 L 927 367' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<rect x='28' y='500' width='224' height='92' fill='#d5f5e3' fill-opacity='1.0' rx='10' stroke='#1a7a38' stroke-width='1.8'/>
<text x='42' y='524' text-anchor='start' font-size='15' fill='#1a7a38' font-weight='bold'>Reconstruction cost · R</text>
<text x='42' y='548' text-anchor='start' font-size='12.5' fill='#2c3e50'>Score the opening inverse and</text>
<text x='42' y='567' text-anchor='start' font-size='12.5' fill='#2c3e50'>the path’s reconstruction terms.</text>
<path d='M 140 415 L 140 500' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<path d='M 360 415 L 360 475 L 222 475 L 222 500' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<rect x='927' y='500' width='224' height='92' fill='#d5f5e3' fill-opacity='1.0' rx='10' stroke='#1a7a38' stroke-width='1.8'/>
<text x='941' y='524' text-anchor='start' font-size='15' fill='#1a7a38' font-weight='bold'>Answer cost · A</text>
<text x='941' y='548' text-anchor='start' font-size='12.5' fill='#2c3e50'>Score the supervised output,</text>
<text x='941' y='567' text-anchor='start' font-size='12.5' fill='#2c3e50'>including a target of silence.</text>
<path d='M 1040 415 L 1040 500' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<path d='M 426 415 L 426 457 L 970 457 L 970 500' fill='none' stroke='#ca6f1e' stroke-width='1.8' marker-end='url(#arro)'/>
<text x='697' y='448' text-anchor='middle' font-size='13' fill='#ca6f1e'>Numeric output reads the composed state through an affine head</text>
<rect x='413' y='500' width='354' height='92' fill='#d5f5e3' fill-opacity='1.0' rx='10' stroke='#1a7a38' stroke-width='1.8'/>
<text x='590.0' y='524' text-anchor='middle' font-size='15' fill='#1a7a38' font-weight='bold'>Keep one complete path per stream</text>
<text x='590.0' y='548' text-anchor='middle' font-size='12.5' fill='#2c3e50'>Minimize R + A. The greedy path wins a tie.</text>
<text x='590.0' y='567' text-anchor='middle' font-size='12.5' fill='#2c3e50'>Commit the winning reading and effects.</text>
<path d='M 252 546 L 413 546' fill='none' stroke='#1a7a38' stroke-width='1.8' marker-end='url(#arrg)'/>
<path d='M 927 546 L 767 546' fill='none' stroke='#1a7a38' stroke-width='1.8' marker-end='url(#arrg)'/>
<text x='590.0' y='633' text-anchor='middle' font-size='13' fill='#2c3e50'>With the unit delay enabled, each look can read percepts and concepts observed one step earlier. The opening has no attention mask.</text>
<text x='590.0' y='656' text-anchor='middle' font-size='13' fill='#626567' font-style='italic'>Without output supervision, R selects the path first. Only the kept path runs closing thought.</text>
</svg>