<svg width='1440' height='876' xmlns='http://www.w3.org/2000/svg' font-family='Georgia, serif' >
  <rect width='1440' height='876' fill='#fafafa'/>
<defs><marker id='arrd' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#2c3e50'/></marker><marker id='arrb' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#2980b9'/></marker><marker id='arrg' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#27ae60'/></marker><marker id='arro' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#ca6f1e'/></marker><marker id='arrp' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#8e44ad'/></marker></defs>
<text x='720' y='40' text-anchor='middle' font-size='30' fill='#222222' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>BasicModel Space Hierarchy</text>
<text x='720' y='66' text-anchor='middle' font-size='14' fill='#626567'>Forward (ownership): IS → {PS, WS, SS, LS} → CS → OS  ·  Reverse: OS → SS → CS → {PS, WS} → IS  ·  CS is the sole reducer and owner of every commit</text>
<rect x='380' y='88' width='200' height='48' fill='#d6eaf8' fill-opacity='1.0' rx='10' stroke='#2980b9' stroke-width='2'/>
<text x='480' y='119' text-anchor='middle' font-size='18' fill='#2c3e50' font-weight='bold'>InputSpace (IS)</text>
<rect x='40' y='176' width='880' height='318' fill='#eef6fb' fill-opacity='1.0' rx='14' stroke='#2980b9' stroke-width='2'/>
<text x='480' y='208' text-anchor='middle' font-size='18' fill='#2c3e50' font-weight='bold'>Perceptual Spaces</text>
<text x='480' y='484' text-anchor='middle' font-size='12.5' fill='#2c3e50' font-style='italic'>peers: the input fans to both towers; no PS → WS edge</text>
<rect x='70' y='228' width='400' height='230' fill='#d6eaf8' fill-opacity='1.0' rx='10' stroke='#2980b9' stroke-width='1.8'/>
<text x='90' y='264' text-anchor='start' font-size='28' fill='#2980b9' font-weight='bold'>PS</text>
<text x='144' y='264' text-anchor='start' font-size='20' fill='#2c3e50' font-weight='bold'>Part Space</text>
<text x='88' y='298' text-anchor='start' font-size='14.2' fill='#2c3e50'>• bottom-up synthesis of ordered parts</text>
<text x='88' y='322' text-anchor='start' font-size='14.2' fill='#2c3e50'>• native radix ids and ordered witnesses</text>
<text x='88' y='346' text-anchor='start' font-size='14.2' fill='#2c3e50'>• code = max of constituent codes</text>
<text x='88' y='370' text-anchor='start' font-size='14.2' fill='#2c3e50'>• one percept store; ids decide presence</text>
<text x='88' y='394' text-anchor='start' font-size='14.2' fill='#2c3e50'>• no learned fold inside the tower</text>
<text x='88' y='418' text-anchor='start' font-size='14.2' fill='#2c3e50'>• the ordered witness gives the exact reverse</text>
<rect x='490' y='228' width='400' height='230' fill='#d5f5e3' fill-opacity='1.0' rx='10' stroke='#27ae60' stroke-width='1.8'/>
<text x='510' y='264' text-anchor='start' font-size='28' fill='#27ae60' font-weight='bold'>WS</text>
<text x='564' y='264' text-anchor='start' font-size='20' fill='#2c3e50' font-weight='bold'>Whole Space</text>
<text x='508' y='298' text-anchor='start' font-size='14.2' fill='#2c3e50'>• top-down division by primitive properties</text>
<text x='508' y='322' text-anchor='start' font-size='14.2' fill='#2c3e50'>• one property codebook (ASCII classes)</text>
<text x='508' y='346' text-anchor='start' font-size='14.2' fill='#2c3e50'>• max over allowed primitives per position</text>
<text x='508' y='370' text-anchor='start' font-size='14.2' fill='#2c3e50'>• min pervasion over a run</text>
<text x='508' y='394' text-anchor='start' font-size='14.2' fill='#2c3e50'>• no perceptual pi layer</text>
<text x='508' y='418' text-anchor='start' font-size='14.2' fill='#2c3e50'>• reads conceptual context as its input</text>
<rect x='950' y='176' width='450' height='318' fill='#fdf5ec' fill-opacity='1.0' rx='14' stroke='#ca6f1e' stroke-width='2'/>
<text x='1175' y='208' text-anchor='middle' font-size='18' fill='#2c3e50' font-weight='bold'>Symbol and Language</text>
<rect x='970' y='216' width='410' height='96' fill='#fff' fill-opacity='1.0' rx='10' stroke='#ca6f1e' stroke-width='1.5'/>
<text x='988' y='246' text-anchor='start' font-size='22' fill='#ca6f1e' font-weight='bold'>LS</text>
<text x='1028' y='246' text-anchor='start' font-size='18' fill='#2c3e50' font-weight='bold'>LanguageSpace</text>
<text x='988' y='274' text-anchor='start' font-size='13.5' fill='#2c3e50'>• scheduling: chooses grammar operations</text>
<text x='988' y='296' text-anchor='start' font-size='13.5' fill='#2c3e50'>• returns choice tensors; CS applies them</text>
<rect x='970' y='326' width='410' height='136' fill='#fdebd0' fill-opacity='1.0' rx='10' stroke='#ca6f1e' stroke-width='1.5'/>
<text x='988' y='356' text-anchor='start' font-size='22' fill='#ca6f1e' font-weight='bold'>SS</text>
<text x='1028' y='356' text-anchor='start' font-size='18' fill='#2c3e50' font-weight='bold'>SymbolSpace</text>
<text x='988' y='384' text-anchor='start' font-size='13.5' fill='#2c3e50'>• zero-dimensional references to CS concepts</text>
<text x='988' y='405' text-anchor='start' font-size='13.5' fill='#2c3e50'>• LanguageLayer: compose, thought, generate</text>
<text x='988' y='426' text-anchor='start' font-size='13.5' fill='#2c3e50'>• TruthLayer; LTM0, the occurrence store</text>
<text x='988' y='447' text-anchor='start' font-size='13.5' fill='#2c3e50'>• no percept codebook, no atomic forward</text>
<rect x='190' y='556' width='1060' height='200' fill='#f5eef8' fill-opacity='1.0' rx='14' stroke='#8e44ad' stroke-width='2'/>
<text x='214' y='592' text-anchor='start' font-size='22' fill='#8e44ad' font-weight='bold'>Conceptual Space (CS)</text>
<text x='214' y='626' text-anchor='start' font-size='14.2' fill='#2c3e50'>• sole reducer: commits concepts, STM and grammar transactions (CSsub, CSsym, CSLang)</text>
<text x='214' y='652' text-anchor='start' font-size='14.2' fill='#2c3e50'>• concept dictionary: code = signed activation × softplus(atom); two symbols per concept</text>
<text x='214' y='678' text-anchor='start' font-size='14.2' fill='#2c3e50'>• definitions: pi (conjunctive) only at order 0, sigma (disjunctive) at every order</text>
<text x='214' y='704' text-anchor='start' font-size='14.2' fill='#2c3e50'>• ConceptAllocator: ids and ordered records; ConceptualAttentionLayer relation store; LTM1</text>
<text x='214' y='730' text-anchor='start' font-size='14.2' fill='#2c3e50'>• STM (8 chunks) · MTM (tokens, familiar tier) · ActivationPredictor (expectation)</text>
<rect x='620' y='790' width='200' height='48' fill='#fdebd0' fill-opacity='1.0' rx='10' stroke='#ca6f1e' stroke-width='2'/>
<text x='720' y='821' text-anchor='middle' font-size='18' fill='#ca6f1e' font-weight='bold'>OutputSpace (OS)</text>
<path d='M 430 136 L 430 156 L 270 156 L 270 228' fill='none' stroke='#2980b9' stroke-width='1.8' marker-end='url(#arrb)'/>
<path d='M 530 136 L 530 156 L 690 156 L 690 228' fill='none' stroke='#27ae60' stroke-width='1.8' marker-end='url(#arrg)'/>
