<path d='M 1080 556 L 1080 462' fill='none' stroke='#8e44ad' stroke-width='1.8' marker-end='url(#arrp)'/>
<path d='M 1160 462 L 1160 556' fill='none' stroke='#ca6f1e' stroke-width='1.8' marker-end='url(#arro)'/>
<text x='1170' y='524' text-anchor='start' font-size='12.5' fill='#2c3e50' font-style='italic'>symbolicOrder × (CS → SS → CS)</text>
<path d='M 1300 326 L 1300 312' fill='none' stroke='#ca6f1e' stroke-width='1.8' marker-end='url(#arro)'/>
<path d='M 1380 264 L 1418 264 L 1418 676 L 1250 676' fill='none' stroke='#ca6f1e' stroke-width='1.8' marker-end='url(#arro)'/>
<text x='1334' y='668' text-anchor='middle' font-size='12.5' fill='#2c3e50' font-style='italic'>choices (CSLang)</text>
<path d='M 210 556 L 210 458' fill='none' stroke='#8e44ad' stroke-width='2.2' stroke-dasharray='8,5' marker-end='url(#arrp)'/>
<path d='M 780 556 L 780 458' fill='none' stroke='#8e44ad' stroke-width='2.2' stroke-dasharray='8,5' marker-end='url(#arrp)'/>
<text x='200' y='524' text-anchor='end' font-size='12.5' fill='#8e44ad' font-style='italic'>attention (positive floor)</text>
<text x='790' y='524' text-anchor='start' font-size='12.5' fill='#8e44ad' font-style='italic'>conceptual context</text>
<text x='40' y='864' text-anchor='start' font-size='12' fill='#626567' font-style='italic'>solid: forward · dashed: conceptual pass-back · sources: Spaces.md (Overview, ownership), Architecture.md (Spaces)</text>
</svg>