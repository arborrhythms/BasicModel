  <rect width='1240' height='836' fill='#fafafa'/>
<defs><marker id='arrd' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#2c3e50'/></marker><marker id='arrb' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#2980b9'/></marker><marker id='arrg' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#27ae60'/></marker><marker id='arro' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#ca6f1e'/></marker><marker id='arrp' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#8e44ad'/></marker><marker id='arrr' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#c0392b'/></marker><marker id='arrt' markerWidth='8' markerHeight='5.6' refX='7' refY='2.8' orient='auto'><polygon points='0 0, 8 2.8, 0 5.6' fill='#16a085'/></marker></defs>
<rect x='0' y='0' width='1240' height='44' fill='#2c3e50' fill-opacity='1.0' rx='0'/>
<text x='620' y='29' text-anchor='middle' font-size='18' fill='white' font-weight='bold'>Memory: in focus, familiar, known, and the long-term strata</text>
<text x='620' y='66' text-anchor='middle' font-size='13' fill='#626567' font-style='italic'>Architecture.md: Rows, Identity and the LTM0 occurrence rows · STM.md · Orders.md §10</text>
<rect x='30' y='92' width='320' height='228' fill='#d6eaf8' fill-opacity='1.0' rx='10' stroke='#2980b9' stroke-width='1.8'/>
<text x='44' y='116' text-anchor='start' font-size='15' fill='#2980b9' font-weight='bold'>STM · in focus</text>
<text x='44' y='140.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>a fixed working set of stmCapacity (8)</text>
<text x='44' y='158.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>chunks, newest at slot 0; the same</text>
<text x='44' y='177.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>tensors serve parsing, recent entries,</text>
<text x='44' y='195.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>recall and serial thought</text>
<text x='44' y='214.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>each chunk: content, references and</text>
<text x='44' y='232.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>its two evidence lanes (chunk_truth)</text>
<text x='44' y='251.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>MTM symbols prepended at the open</text>
<text x='44' y='269.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>bind's intersection, computed on read</text>
<rect x='450' y='92' width='380' height='252' fill='#d1f2eb' fill-opacity='1.0' rx='10' stroke='#16a085' stroke-width='1.8'/>
<text x='464' y='116' text-anchor='start' font-size='15' fill='#16a085' font-weight='bold'>MTM · familiar</text>
<text x='464' y='140.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>ConceptualSpace.mtm, capacity 64 tokens</text>
<text x='464' y='158.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>each token: kind, access count, last model</text>
<text x='464' y='177.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>time, introduction and use addresses</text>
<text x='464' y='195.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>its current value: the state after its latest verb</text>
<text x='464' y='214.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>names mapped to identities; event histories;</text>
<text x='464' y='232.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>an actual and alternative timelines</text>
<text x='464' y='251.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>familiar-tier candidates with sparse support</text>
<text x='464' y='269.5' text-anchor='start' font-size='12.5' fill='#2c3e50'>expires after 16 kept closes unreferenced;</text>
<text x='464' y='288.0' text-anchor='start' font-size='12.5' fill='#2c3e50'>cleared at the epoch boundary</text>
<rect x='910' y='92' width='300' height='228' fill='#f5eef8' fill-opacity='1.0' rx='10' stroke='#8e44ad' stroke-width='1.8'/>
<text x='924' y='116' text-anchor='start' font-size='15' fill='#8e44ad' font-weight='bold'>Concepts · known</text>
<text x='924' y='140' text-anchor='start' font-size='12.5' fill='#2c3e50'>a minted row at the shared index</text>
<text x='924' y='159' text-anchor='start' font-size='12.5' fill='#2c3e50'>its content: the fold of its</text>
<text x='924' y='178' text-anchor='start' font-size='12.5' fill='#2c3e50'>occurrences, rebuildable</text>
<text x='924' y='197' text-anchor='start' font-size='12.5' fill='#2c3e50'>sigma/pi definitions and an order</text>
<text x='924' y='216' text-anchor='start' font-size='12.5' fill='#2c3e50'>ids and ordered records owned</text>
<text x='924' y='235' text-anchor='start' font-size='12.5' fill='#2c3e50'>by the ConceptAllocator</text>
<rect x='30' y='448' width='380' height='196' fill='#f2f3f4' fill-opacity='1.0' rx='10' stroke='#2c3e50' stroke-width='1.8'/>
<text x='44' y='472' text-anchor='start' font-size='15' fill='#2c3e50' font-weight='bold'>LTM0 · the occurrence store</text>
<text x='44' y='496' text-anchor='start' font-size='12.5' fill='#2c3e50'>one row per kept occurrence: its slot,</text>
<text x='44' y='515' text-anchor='start' font-size='12.5' fill='#2c3e50'>.when band, truth_plus and truth_minus,</text>
<text x='44' y='534' text-anchor='start' font-size='12.5' fill='#2c3e50'>access count and surprise</text>
<text x='44' y='553' text-anchor='start' font-size='12.5' fill='#2c3e50'>the occurrence index: stable addresses,</text>
<text x='44' y='572' text-anchor='start' font-size='12.5' fill='#2c3e50'>stream, document and content keys</text>
<text x='44' y='591' text-anchor='start' font-size='12.5' fill='#2c3e50'>order read from the referent</text>
<rect x='450' y='448' width='380' height='196' fill='#f2f3f4' fill-opacity='1.0' rx='10' stroke='#2c3e50' stroke-width='1.8'/>
<text x='464' y='472' text-anchor='start' font-size='15' fill='#2c3e50' font-weight='bold'>LTM1 · the relation stratum</text>
<text x='464' y='496' text-anchor='start' font-size='12.5' fill='#2c3e50'>a row is two tagged references; its kind</text>
<text x='464' y='515' text-anchor='start' font-size='12.5' fill='#2c3e50'>is read from the referents: definition,</text>
<text x='464' y='534' text-anchor='start' font-size='12.5' fill='#2c3e50'>attribution or conditional</text>
<text x='464' y='553' text-anchor='start' font-size='12.5' fill='#2c3e50'>owned with the symbol taxonomy by the</text>
<text x='464' y='572' text-anchor='start' font-size='12.5' fill='#2c3e50'>ConceptAllocator</text>
<text x='464' y='591' text-anchor='start' font-size='12.5' fill='#2c3e50'>LTM2 names relations over relations</text>
<rect x='910' y='448' width='300' height='196' fill='#f2f3f4' fill-opacity='1.0' rx='10' stroke='#626567' stroke-width='1.8'/>
<text x='924' y='472' text-anchor='start' font-size='15' fill='#626567' font-weight='bold'>Folds, not rows</text>
<text x='924' y='496' text-anchor='start' font-size='12.5' fill='#2c3e50'>parthood, subsumption and kind</text>
<text x='924' y='515' text-anchor='start' font-size='12.5' fill='#2c3e50'>statements are folds in the</text>
<text x='924' y='534' text-anchor='start' font-size='12.5' fill='#2c3e50'>meronomy and the taxonomy over</text>
<text x='924' y='553' text-anchor='start' font-size='12.5' fill='#2c3e50'>symbols</text>
<text x='924' y='572' text-anchor='start' font-size='12.5' fill='#2c3e50'>equality is membership in</text>
<text x='924' y='591' text-anchor='start' font-size='12.5' fill='#2c3e50'>a singleton</text>
<path d='M 350 160 L 450 160' fill='none' stroke='#16a085' stroke-width='1.8' marker-end='url(#arrt)'/>
<circle cx='400' cy='146' r='10' fill='#fff' fill-opacity='1' stroke='#16a085' stroke-width='1.5'/><text x='400' y='150' text-anchor='middle' font-size='11' fill='#16a085' font-weight='bold'>1</text>
<path d='M 450 250 L 350 250' fill='none' stroke='#2980b9' stroke-width='1.8' stroke-dasharray='7,4' marker-end='url(#arrb)'/>
