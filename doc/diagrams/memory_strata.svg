<path d='M 830 190 L 910 190' fill='none' stroke='#8e44ad' stroke-width='1.8' marker-end='url(#arrp)'/>
<circle cx='870' cy='176' r='10' fill='#fff' fill-opacity='1' stroke='#8e44ad' stroke-width='1.5'/><text x='870' y='180' text-anchor='middle' font-size='11' fill='#8e44ad' font-weight='bold'>3</text>
<path d='M 110 320 L 110 448' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<circle cx='126' cy='386' r='10' fill='#fff' fill-opacity='1' stroke='#2c3e50' stroke-width='1.5'/><text x='126' y='390' text-anchor='middle' font-size='11' fill='#2c3e50' font-weight='bold'>4</text>
<path d='M 250 448 L 250 320' fill='none' stroke='#2980b9' stroke-width='1.8' stroke-dasharray='7,4' marker-end='url(#arrb)'/>
<circle cx='266' cy='386' r='10' fill='#fff' fill-opacity='1' stroke='#2980b9' stroke-width='1.5'/><text x='266' y='390' text-anchor='middle' font-size='11' fill='#2980b9' font-weight='bold'>7</text>
<path d='M 330 320 L 330 396 L 560 396 L 560 448' fill='none' stroke='#2c3e50' stroke-width='1.8' marker-end='url(#arrd)'/>
<circle cx='445' cy='396' r='10' fill='#fff' fill-opacity='1' stroke='#2c3e50' stroke-width='1.5'/><text x='445' y='400' text-anchor='middle' font-size='11' fill='#2c3e50' font-weight='bold'>5</text>
<path d='M 760 448 L 760 404 L 1000 404 L 1000 320' fill='none' stroke='#8e44ad' stroke-width='1.8' marker-end='url(#arrp)'/>
<circle cx='880' cy='404' r='10' fill='#fff' fill-opacity='1' stroke='#8e44ad' stroke-width='1.5'/><text x='880' y='408' text-anchor='middle' font-size='11' fill='#8e44ad' font-weight='bold'>6</text>
<line x1='1140' y1='320' x2='1140' y2='448' stroke='#626567' stroke-width='1.8' stroke-dasharray='3,3'/>
<circle cx='1140' cy='384' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='1140' y='388' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>8</text>
<circle cx='40' cy='686' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='40' y='690' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>1</text>
<text x='58' y='690' text-anchor='start' font-size='12' fill='#2c3e50'>the kept close writes bindings, current values and opened tokens; trial-local records before it</text>
<circle cx='40' cy='716' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='40' y='720' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>2</text>
<text x='58' y='720' text-anchor='start' font-size='12' fill='#2c3e50'>bind reads an accessible antecedent, which must beat a zero-logit dummy</text>
<circle cx='40' cy='746' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='40' y='750' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>3</text>
<text x='58' y='750' text-anchor='start' font-size='12' fill='#2c3e50'>promotion by recurrence: conceptMintCount observations within the horizon, outside the both corner</text>
<circle cx='40' cy='776' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='40' y='780' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>4</text>
<text x='58' y='780' text-anchor='start' font-size='12' fill='#2c3e50'>the kept close writes the occurrence row</text>
<circle cx='640' cy='686' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='640' y='690' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>5</text>
<text x='658' y='690' text-anchor='start' font-size='12' fill='#2c3e50'>a kept definition writes its relation row; it can mint its subject</text>
<circle cx='640' cy='716' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='640' y='720' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>6</text>
<text x='658' y='720' text-anchor='start' font-size='12' fill='#2c3e50'>raise: raiseCount distinct members sharing a side make a class one order up</text>
<circle cx='640' cy='746' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='640' y='750' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>7</text>
<text x='658' y='750' text-anchor='start' font-size='12' fill='#2c3e50'>recall by cue; a query with only its .when filled returns the entries at that time</text>
<circle cx='640' cy='776' r='10' fill='#fff' fill-opacity='1' stroke='#626567' stroke-width='1.5'/><text x='640' y='780' text-anchor='middle' font-size='11' fill='#626567' font-weight='bold'>8</text>
<text x='658' y='780' text-anchor='start' font-size='12' fill='#2c3e50'>the meronomy and the taxonomy organize the concepts</text>
<text x='620' y='824' text-anchor='middle' font-size='12' fill='#626567' font-style='italic'>in focus: the STM frames · familiar: the MTM pool · known: a minted concept</text>
</svg>